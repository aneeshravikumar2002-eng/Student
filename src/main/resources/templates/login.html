<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard Login</title>

    <style>
        body{
            font-family: Arial;
            background: linear-gradient(to right,#667eea,#764ba2);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:40px;
            border-radius:15px;
            width:350px;
            box-shadow:0 4px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:8px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#667eea;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#5563d6;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Student Dashboard</h2>

    <form action="/dashboard">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
