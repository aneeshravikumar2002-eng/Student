<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body{
            font-family:Arial;
            margin:0;
            background:#f4f6f9;
        }

        .sidebar{
            width:220px;
            height:100vh;
            background:#667eea;
            color:white;
            position:fixed;
            padding:20px;
        }

        .content{
            margin-left:240px;
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            margin:15px;
            display:inline-block;
            width:220px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>Dashboard</h2>
    <p>Profile</p>
    <p>Courses</p>
    <p>Attendance</p>
    <p>Logout</p>
</div>

<div class="content">
    <h1>Welcome Aneesh 👋</h1>

    <div class="card">
        <h3>Java</h3>
        <p>Progress: 80%</p>
    </div>

    <div class="card">
        <h3>DevOps</h3>
        <p>Progress: 75%</p>
    </div>

    <div class="card">
        <h3>AWS</h3>
        <p>Progress: 90%</p>
    </div>

</div>

</body>
</html>
